name: Bug report
description: Report a reproducible workstation issue
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Revision, NixOS version, profile and GPU
      description: Redact personal information. Do not include secrets.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction and relevant logs
    validations:
      required: true
